[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-clips"
version = "0.1.0"
description = "Local-first video editing pipeline with optional Jianying, Agent Skill, Step ASR and Openverse integrations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "VIDEO-Clips contributors"}]
dependencies = []

[project.scripts]
video-clips = "video_clips.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_clips = ["web/*.html", "web/*.css", "web/*.js"]
